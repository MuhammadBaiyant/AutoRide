<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rental Enquiry | AutoRide Car Rentals</title>
    <meta
      name="description"
      content="Send AutoRide Car Rentals a rental enquiry. Choose a vehicle and provide your preferred rental dates."
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body class="contact-page">
    <header>
      <h1>AutoRide Car Rentals</h1>
      <nav>
        <img src="images/logo.png" alt="AutoRide logo" class="logo" />
        <a href="index.html">Home</a>
        <a href="about.html">About Us</a>
        <a href="services.html">Services</a>
        <a href="gallery.html">Gallery</a>
        <a href="enquiry.html">Rental Enquiry</a>
        <a href="contact.html">Contact Us</a>
      </nav>
    </header>

    <main>
      <h2>Rental Enquiry</h2>
      <p>Complete the form below to enquire about renting a vehicle.</p>

      <form id="enquiry-form" action="#" method="post">
        <label for="name">Full Name:</label>
        <input type="text" id="name" name="name" required />

        <label for="email">Email Address:</label>
        <input type="email" id="email" name="email" required />

        <label for="phone">Phone Number:</label>
        <input type="tel" id="phone" name="phone" required />

        <label for="vehicle">Vehicle Category:</label>
        <select id="vehicle" name="vehicle" required>
          <option value="">Select a category</option>
          <option value="Economy">Economy</option>
          <option value="Sedan">Sedan</option>
          <option value="SUV">SUV</option>
          <option value="Luxury">Luxury</option>
          <option value="Long-Term">Long-Term Rental</option>
        </select>

        <label for="pickup">Pickup Date:</label>
        <input type="date" id="pickup" name="pickup" required />

        <label for="return">Return Date:</label>
        <input type="date" id="return" name="return" required />

        <label for="message">Additional Information:</label>
        <textarea id="message" name="message" rows="5"></textarea>

        <input type="submit" value="Submit Enquiry" />
      </form>

      <p id="enquiry-response"></p>
    </main>

    <footer>
      <p>&copy; ST10515946 AutoRide Car Rentals</p>
    </footer>

    <script src="js/main.js"></script>
    <script src="js/enquiry.js"></script>
  </body>
</html>
