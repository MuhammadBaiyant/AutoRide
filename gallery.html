<!doctype html>
<html lang="en">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vehicle Gallery | AutoRide Car Rentals</title>
    <meta
      name="description"
      content="View the vehicles available for hire at AutoRide Car Rentals, from economy cars to luxury vehicles."
    />
    <link rel="stylesheet" type="text/css" href="css/style.css" />
  </head>
  <body class="gallery-page">
    <header>
      <h1>AutoRide Car Rentals</h1>
      <nav class="navbar">
        <a href="home.html" class="nav-logo">
          <img src="images/logo.png" alt="AutoRide Car Rentals logo" />
        </a>

        <div class="nav-links">
          <a href="index.html">Home</a>
          <a href="about.html">About Us</a>
          <a href="services.html">Services</a>
          <a href="gallery.html" class="active">Gallery</a>
          <a href="enquiry.html">Rental Enquiry</a>
          <a href="contact.html">Contact Us</a>
        </div>
      </nav>
    </header>
    <main>
      <h2>Our Vehicle Gallery</h2>
      <!-- //figure tells the browser:"This content is a self-contained figure/illustration related to the page." -->
      <figure>
        <img src="images/cars.jpg" alt="Rental car" class="gallery-image" />
        <figcaption>AutoRide Rental Vehicles</figcaption>
      </figure>
      <figure>
        <img src="images/sedan.jpg" alt="Sedan" class="gallery-image" />
        <figcaption>Sedan Vehicle</figcaption>
      </figure>
      <figure>
        <img src="images/suv.jpg" alt="SUV" class="gallery-image" />
        <figcaption>SUV Vehicle</figcaption>
      </figure>
      <figure>
        <img
          src="images/luxury.jpg"
          alt="Luxury car"
          class="gallery-image"
          loading="lazy"
        />
        <figcaption>Luxury Vehicle</figcaption>
      </figure>

      <figure>
        <img
          src="images/economy.jpg"
          alt="Economy car"
          class="gallery-image"
          loading="lazy"
        />
        <figcaption>Economy Vehicle</figcaption>
      </figure>
      <h2>Our Cars in Action</h2>

      <video class="gallery-video" controls>
        <source
          src="images/YTDown.com_YouTube_SANI-Car-Rental-South-Africa-Introductio_Media_tSGW7Hb3X3s_001_1080p.mp4"
          type="video/mp4"
        />
        Your browser does not support the video element.
      </video>

      <div id="lightbox" class="lightbox" hidden>
        <button id="close-lightbox" type="button">Close ✕</button>
        <img id="lightbox-image" src="" alt="Enlarged vehicle image" />
      </div>
    </main>
    <footer>
      <div class="footer-bottom">
        <p>&copy; 2026 AutoRide Car Rentals. All rights reserved. ST10515946</p>
      </div>
    </footer>
    <script src="js/main.js"></script>
  </body>
</html>
