<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Contact</title>
    </head>
    <body style="background-color:darkcyan">
<header>
    <h1>AutoRide Car Rentals</h1>
    <nav>
        <img src="images/logo.png" style="width: 70px; height: 85px;">
        <a href="home.html">Home</a>

        <a href="services.html">Services</a>

    </nav>
</header>
<main>
    <h2>Contact Us</h2>
    <p><strong>Address:</strong> 123 Main Street, Johannesburg, South Africa</p>
    <p><strong>Phone:</strong> 011 123 4567</p>
    <p><strong>Email:</strong> info@autoRide.co.za</p>
    <p><strong>Business Hours:</strong> Monday - Saturday, 08:00 - 17:00</p>

    <h2>Rental Enquiry</h2>

        <form>
            <p>
                <label for="name">Full Name:</label><br>
                <input type="text" id="name" name="name">
            </p>
            <p>
                <label for="email">Email:</label><br>
                <input type="email" id="email" name="email">
            </p>
            <p>
                <label for="phone">Phone:</label><br>
                <input type="tel" id="phone" name="phone">
            </p>
            <p>
                <label for="car">Car Type:</label><br>

                <select id="car" name="car">
                    <option value="economy">Economy</option>
                    <option value="sedan">Sedan</option>
                    <option value="suv">SUV</option>
                    <option value="luxury">Luxury</option>
                </select>
            </p>
            <p>
                <label for="pickup">Pick-up Date:</label><br>
                <input type="date" id="pickup" name="pickup">
            </p>
            <p>
                <label for="return">Return Date:</label><br>
                <input type="date" id="return" name="return">
            </p>
            <p>
                <label for="message">Message:</label><br>
                <textarea id="message" name="message" rows="5" cols="30"></textarea>
            </p>
            <p>
                <input type="submit" value="Submit Enquiry">
            </p>
        </form>

</main>
<footer>&copy;ST10515946</footer>
</body>
</html>
